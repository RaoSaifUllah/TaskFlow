name: Foundation verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: taskflow_migrator
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: taskflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskflow_migrator -d taskflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASKFLOW_MIGRATION_CONNECTION: Host=localhost;Database=taskflow_test;Username=taskflow_migrator;Password=disposable-ci-only
      TASKFLOW_TEST_WRITE: Host=localhost;Database=taskflow_test;Username=taskflow_migrator;Password=disposable-ci-only
      TASKFLOW_TEST_READ: Host=localhost;Database=taskflow_test;Username=taskflow_read;Password=disposable-read-only
      PGHOST: localhost
      PGUSER: taskflow_migrator
      PGDATABASE: taskflow_test
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: dotnet restore backend/TaskFlow.slnx --configfile NuGet.Config --locked-mode
      - run: dotnet tool restore --configfile NuGet.Config
      - run: dotnet format backend/TaskFlow.slnx --verify-no-changes --no-restore
      - run: dotnet build backend/TaskFlow.slnx --no-restore
      - name: Disposable database migration up/down/up
        run: |
          dotnet ef database update --project backend/src/TaskFlow.Infrastructure
          dotnet ef database update 0 --project backend/src/TaskFlow.Infrastructure
          dotnet ef database update --project backend/src/TaskFlow.Infrastructure
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE taskflow_read LOGIN PASSWORD 'disposable-read-only'; CREATE ROLE taskflow_write LOGIN PASSWORD 'disposable-write-only';"
          psql -v ON_ERROR_STOP=1 -f deploy/restricted-roles.sql
      - run: dotnet test backend/TaskFlow.slnx --no-restore
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: dotnet list backend/TaskFlow.slnx package --vulnerable --include-transitive
      # Release SAST/secret/container scans, SBOM and provider suites are pending Phase 7.
